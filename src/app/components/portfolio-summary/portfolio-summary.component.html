@if (positions.length > 0) {
  <ag-grid-angular class="ag-theme-alpine" style="width: 100%; height: 53px;" [rowData]="rowData"
    [columnDefs]="columnDefs" [suppressHorizontalScroll]=true (gridReady)="onGridReady($event)" (rowDoubleClicked)="onPortfolioRowDoubleClicked($event)">
  </ag-grid-angular>
}
@if (positions.length == 0) {
  <ag-grid-angular class="ag-theme-alpine" style="width: 100%; height: 53px;" [rowData]="rowData"
    [columnDefs]="totalColumnDefs" (gridReady)="onGridReady($event)" (rowDoubleClicked)="onPortfolioRowDoubleClicked($event)">
  </ag-grid-angular>
}
@if (positions.length > 0) {
  <ag-grid-angular style="width: 100%;" domLayout="autoHeight" class="ag-theme-alpine" [rowData]="positions"
    [columnDefs]="positionColumnDefs" (gridReady)="onGridReady($event)" (rowDoubleClicked)="onPositionRowDoubleClicked($event)">
  </ag-grid-angular>
}
